plugins {
    id 'java-library'
    id 'org.springframework.boot' version '4.0.3'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'maven-publish'
    // version = gradle.properties dmsal_license_version (same as Git dmsal-license tag / v*/ folder)
    id 'org.digitalmind.dmsal-license' version "${dmsal_license_version}"
}

ext {
    lombokVersion = '1.18.44'
}
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}
bootJar {
    enabled = false
}

dmsalLicense {
    packageIntoJar = true
}

jar {
    archiveBaseName = "i18n-core"
    enabled = true
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

dependencies {
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework.boot:spring-boot-starter-web"
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    implementation "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    implementation "org.digitalmind.buildingblocks.core:jpautils:4.0.0"

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.2'
}

publishing {
    repositories {
        maven {
            name = "digitalmind"
            url = uri("https://maven.pkg.github.com/Digital-Mind-Solutions/maven-repository")
            credentials {
                username = project.findProperty("dm.ghub.user") ?: System.getenv("DM_GITHUB_USER")
                password = project.findProperty("dm.ghub.key") ?: System.getenv("DM_GITHUB_TOKEN")
            }
        }
    }
    publications {
        i18nCore(MavenPublication) {
            from components.java
        }
    }
}
