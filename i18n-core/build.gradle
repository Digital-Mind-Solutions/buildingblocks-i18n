plugins {
    id 'java-library'
    id 'org.springframework.boot' version '4.0.3'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'maven-publish'
}

ext {
    lombokVersion = '1.18.44'
}
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}
bootJar {
    enabled = false
}

configurations {
    dmsalLicense
}

// Isolated: resolve composite/Maven dmsal-license → stage under build/ → jar reads only the staged file.
def dmsalLicenseStaged = layout.buildDirectory.file('dmsal/LICENSE.md')

tasks.register('fetchDmsalLicense') {
    group = 'build'
    description = 'Stage META-INF/LICENSE.md from org.digitalmind.license:dmsal-license into build/dmsal/'
    dependsOn configurations.dmsalLicense
    inputs.files(configurations.dmsalLicense)
    outputs.file(dmsalLicenseStaged)
    doLast {
        def artifact = configurations.dmsalLicense.singleFile
        def matches = zipTree(artifact).matching { include 'META-INF/LICENSE.md' }.files
        if (matches.isEmpty()) {
            throw new GradleException(
                    "No META-INF/LICENSE.md inside ${artifact.name}. " +
                    "Clone ../dmsal-license (includeBuild) or resolve org.digitalmind.license:dmsal-license:1.0."
            )
        }
        def dest = dmsalLicenseStaged.get().asFile
        dest.parentFile.mkdirs()
        dest.bytes = matches.first().bytes
        if (dest.length() == 0L) {
            throw new GradleException("Staged DMSAL LICENSE.md is empty (from ${artifact.absolutePath})")
        }
        logger.lifecycle("Staged DMSAL licence from ${artifact.name} -> ${dest.absolutePath}")
    }
}

jar {
    archiveBaseName = "i18n-core"
    enabled = true
    dependsOn tasks.named('fetchDmsalLicense')
    metaInf {
        from(dmsalLicenseStaged) {
            rename { 'LICENSE.md' }
        }
    }
}

dependencies {
    // Composite: settings includeBuild('../dmsal-license') substitutes this module from the sibling clone.
    dmsalLicense 'org.digitalmind.license:dmsal-license:1.0'

    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework.boot:spring-boot-starter-web"
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    implementation "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    implementation "org.digitalmind.buildingblocks.core:jpautils:4.0.0"

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

publishing {
    repositories {
        maven {
            name = "digitalmind"
            url = uri("https://maven.pkg.github.com/Digital-Mind-Solutions/maven-repository")
            credentials {
                username = project.findProperty("dm.ghub.user") ?: System.getenv("DM_GITHUB_USER")
                password = project.findProperty("dm.ghub.key") ?: System.getenv("DM_GITHUB_TOKEN")
            }
        }
    }
    publications {
        i18nCore(MavenPublication) {
            from components.java
        }
    }
}
